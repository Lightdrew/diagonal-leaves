plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

subprojects {
    tasks.withType(ProcessResources).configureEach {
        def expandProps = project.properties.findAll {key,value ->
            value instanceof String || value instanceof Boolean || value instanceof Integer
        }

        filesMatching(["*.mixins.json", "fabric.mod.json", "META-INF/neoforge.mods.toml", "pack.mcmeta"]) {
            expand expandProps
        }

        inputs.properties(expandProps)
    }
}
